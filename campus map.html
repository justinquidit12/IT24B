        function initMap() {
            // Initialize the map and set its view to the specified coordinates and zoom level
        }

            //openstreetmap
            const openstreetmap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'

        });
        //satelite
        const satelite = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: `Tiles (c) Esri - Source, Macsar, Earthstar Geographics, and the GIS User Community`

        });

        openstreetmap.addTo(map);
        console.log("Base map tile layer loaded" + Date());

        const markerGroups = {};

        fetch(campus-map.json)
            .then(response => response.json())
            .then(data => {
               data.forEach(pin => {
    const type = pin.locationType || "other";

    //create marker group
    if (!markerGroups[type]) {
        markerGroups[type] = L.layerGroup();
    }

    //marker and popup
    const marker = L.marker([pin.lat, pin.lng]).addTo(map);
    const img = `<img src='${pin.img}' class='popup-image'>`;
    marker.bindPopup(`
        ${img}<br>
        <br>${pin.name}</br><br>
        ${pin.description}
    `);
    console.log("Pin added: " + pin.name + " " + Date());

    markerGroups[type].addLayer(marker);
});

        .catch(error => console.error("Error loading map data:", error));
    
        
    
    document.addEventListener('DOMContentLoaded', () => {
        initMap('campus-map.json');

    </script>
